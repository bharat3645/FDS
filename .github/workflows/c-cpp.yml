name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # This is a loose collection of standalone C assignments -- there's no
    # configure/Makefile (and never was), so build each source file directly
    # with gcc and smoke-run the resulting binary.
    strategy:
      fail-fast: false
      matrix:
        include:
          - src: ass1.c
            bin: build/ass1
          - src: ass2.c
            bin: build/ass2
            stdin: "{[()]}"
          - src: ass3.c
            bin: build/ass3
          - src: code1
            bin: build/code1
          - src: code2
            bin: build/code2
            stdin: "{[()]}"
          - src: code3
            bin: build/code3

    steps:
      - uses: actions/checkout@v4

      - name: Compile ${{ matrix.src }}
        run: |
          mkdir -p build
          gcc -Wall -Wextra -x c "${{ matrix.src }}" -o "${{ matrix.bin }}"

      - name: Run ${{ matrix.bin }}
        run: |
          if [ -n "${{ matrix.stdin }}" ]; then
            echo "${{ matrix.stdin }}" | "./${{ matrix.bin }}"
          else
            "./${{ matrix.bin }}"
          fi
